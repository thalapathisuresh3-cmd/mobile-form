<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Measurement Entry</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f4f6f8;
    }
    label {
      font-weight: 500;
      font-size: 0.9rem;
    }
    .form-control {
      font-size: 1rem;
    }
    .slab-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="container py-3">

  <h4 class="text-center mb-3">Measurement Entry</h4>

  <!-- STANDARD HEADER FIELDS -->
  <div class="row g-2">

    <div class="col-6">
      <label>Factory Name</label>
      <input class="form-control" id="factory">
    </div>

    <div class="col-6">
      <label>Material Colour</label>
      <input class="form-control" id="colour">
    </div>

    <div class="col-6">
      <label>Buyer / Sales Person</label>
      <input class="form-control" id="buyer">
    </div>

    <div class="col-6">
      <label>Marker Name</label>
      <input class="form-control" id="marker">
    </div>

    <div class="col-6">
      <label>Block No</label>
      <input class="form-control" id="blockNo">
    </div>

    <div class="col-6">
      <label>Thickness</label>
      <input class="form-control" disabled placeholder="Auto">
    </div>

    <div class="col-6">
      <label>Date</label>
      <input type="date" class="form-control" id="date">
    </div>

    <div class="col-6">
      <label>MSMT Slab</label>
      <input class="form-control" disabled placeholder="Auto">
    </div>

    <div class="col-6">
      <label>Allowance</label>
      <input class="form-control" id="allowance">
    </div>

    <div class="col-6">
      <label>Unit</label>
      <select class="form-control" id="unit">
        <option value="CM">CM</option>
        <option value="INCH">INCH</option>
      </select>
    </div>

  </div>

  <hr class="my-3">

  <!-- SLAB ENTRIES -->
  <h6 class="mb-2">Slab Details</h6>
  <div id="slabs"></div>

  <button class="btn btn-outline-secondary w-100 mb-2" onclick="addSlab()">+ Add Slab</button>
  <button class="btn btn-primary btn-lg w-100" onclick="submitForm()">Submit</button>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzxU6lUv1Sool7R-yJ6Tvpaoa_aUpXUXk5hpYUMWNi_i8iZS10rByOavRwSQAIWj1XS/exec";
let slabCount = 0;

function addSlab() {
  slabCount++;

  const div = document.createElement("div");
  div.className = "slab-card";
  div.innerHTML = `
    <div class="mb-2"><strong>Slab ${slabCount}</strong></div>
    <input class="form-control mb-1" placeholder="Slab No" id="slabNo${slabCount}">
    <input class="form-control mb-1" placeholder="Gross Length" id="grossL${slabCount}">
    <input class="form-control mb-1" placeholder="Gross Height" id="grossH${slabCount}">
    <input class="form-control mb-1" placeholder="Net Length" id="netL${slabCount}">
    <input class="form-control" placeholder="Net Height" id="netH${slabCount}">
  `;
  document.getElementById("slabs").appendChild(div);
}

function submitForm() {
  const slabs = [];

  for (let i = 1; i <= slabCount; i++) {
    slabs.push({
      slabNo: document.getElementById("slabNo" + i).value,
      grossL: document.getElementById("grossL" + i).value,
      grossH: document.getElementById("grossH" + i).value,
      netL: document.getElementById("netL" + i).value,
      netH: document.getElementById("netH" + i).value
    });
  }

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      factory: factory.value,
      colour: colour.value,
      buyer: buyer.value,
      marker: marker.value,
      blockNo: blockNo.value,
      date: date.value,
      allowance: allowance.value,
      unit: unit.value,
      slabs: slabs
    })
  })
  .then(res => res.text())
  .then(txt => alert("Saved successfully"))
  .catch(err => alert("Error: " + err.message));
}

// Add first slab automatically
addSlab();
</script>

</body>
</html>
