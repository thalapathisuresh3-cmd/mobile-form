<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Measurement Entry</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-3">

  <h4 class="text-center mb-3">Measurement Entry</h4>

  <!-- STANDARD FIELDS -->
  <input class="form-control mb-2" id="factory" placeholder="Factory Name">
  <input class="form-control mb-2" id="colour" placeholder="Material Colour">
  <input class="form-control mb-2" id="buyer" placeholder="Buyer / Sales Person">
  <input class="form-control mb-2" id="marker" placeholder="Marker Name">
  <input class="form-control mb-2" id="blockNo" placeholder="Block No">

  <input class="form-control mb-2" type="date" id="date">
  <input class="form-control mb-3" id="allowance" placeholder="Allowance">

  <!-- UNIT -->
  <select class="form-control mb-3" id="unit">
    <option value="CM">CM</option>
    <option value="INCH">INCH</option>
  </select>

  <hr>

  <!-- SLAB TABLE -->
  <div id="slabs"></div>

  <button class="btn btn-secondary w-100 mb-2" onclick="addSlab()">+ Add Slab</button>
  <button class="btn btn-primary w-100" onclick="submitForm()">Submit</button>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzxU6lUv1Sool7R-yJ6Tvpaoa_aUpXUXk5hpYUMWNi_i8iZS10rByOavRwSQAIWj1XS/exec";
let slabCount = 0;

function addSlab() {
  slabCount++;
  const div = document.createElement("div");
  div.className = "border p-2 mb-2";
  div.innerHTML = `
    <input class="form-control mb-1" placeholder="Slab No" id="slabNo${slabCount}">
    <input class="form-control mb-1" placeholder="Gross Length" id="grossL${slabCount}">
    <input class="form-control mb-1" placeholder="Gross Height" id="grossH${slabCount}">
    <input class="form-control mb-1" placeholder="Net Length" id="netL${slabCount}">
    <input class="form-control mb-1" placeholder="Net Height" id="netH${slabCount}">
  `;
  document.getElementById("slabs").appendChild(div);
}

function submitForm() {
  const slabs = [];

  for (let i = 1; i <= slabCount; i++) {
    slabs.push({
      slabNo: document.getElementById("slabNo" + i).value,
      grossL: document.getElementById("grossL" + i).value,
      grossH: document.getElementById("grossH" + i).value,
      netL: document.getElementById("netL" + i).value,
      netH: document.getElementById("netH" + i).value
    });
  }

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      factory: factory.value,
      colour: colour.value,
      buyer: buyer.value,
      marker: marker.value,
      blockNo: blockNo.value,
      date: date.value,
      allowance: allowance.value,
      unit: unit.value,
      slabs: slabs
    })
  })
.then(res => res.text())
.then(txt => {
  alert("Response from server: " + txt);
})
.catch(err => {
  alert("Error: " + err.message);
});
}

// add first slab automatically
addSlab();
</script>

</body>
</html>
