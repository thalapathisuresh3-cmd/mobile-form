

<body>

<div class="container-fluid py-3">

  <h4 class="text-center mb-3">Measurement Entry</h4>

  <!-- HEADER DETAILS -->
  <div class="row g-2 mb-3">

    <div class="col-6 col-md-3">
      <label>Factory Name</label>
      <input class="form-control" id="factory">
    </div>

    <div class="col-6 col-md-3">
      <label>Material Colour</label>
      <input class="form-control" id="colour">
    </div>

    <div class="col-6 col-md-3">
      <label>Buyer / Sales Person</label>
      <input class="form-control" id="buyer">
    </div>

    <div class="col-6 col-md-3">
      <label>Marker Name</label>
      <input class="form-control" id="marker">
    </div>

    <div class="col-6 col-md-3">
      <label>Block No</label>
      <input class="form-control" id="blockNo">
    </div>

    <div class="col-6 col-md-3">
      <label>Date</label>
      <input type="date" class="form-control" id="date">
    </div>

    <div class="col-6 col-md-3">
      <label>Allowance</label>
      <input class="form-control" id="allowance">
    </div>

    <div class="col-6 col-md-3">
      <label>Unit</label>
      <select class="form-control" id="unit">
        <option value="CM">CM</option>
        <option value="INCH">INCH</option>
      </select>
    </div>

  </div>

  <hr>

  <!-- SLAB DETAILS TABLE -->
  <h6 class="mb-2">Slab Details</h6>

  <div class="table-responsive">
    <table class="table table-bordered table-sm table-striped">
      <thead class="table-light">
        <tr>
          <th>S.No</th>
          <th>Slab No</th>
          <th>Thickness</th>
          <th>Gross Length</th>
          <th>Gross Height</th>
          <th>Net Length</th>
          <th>Net Height</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="slabBody"></tbody>
    </table>
  </div>

  <button class="btn btn-outline-secondary w-100 mb-2" onclick="addSlab()">+ Add Slab</button>
  <button class="btn btn-primary btn-lg w-100" onclick="submitForm()">Submit</button>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzxU6lUv1Sool7R-yJ6Tvpaoa_aUpXUXk5hpYUMWNi_i8iZS10rByOavRwSQAIWj1XS/exec";
let slabCount = 0;

function addSlab() {
  slabCount++;

  const tr = document.createElement("tr");
  tr.id = "slabRow" + slabCount;

  tr.innerHTML = `
    <td>${slabCount}</td>
    <td><input class="form-control form-control-sm" id="slabNo${slabCount}"></td>
    <td><input class="form-control form-control-sm" id="thickness${slabCount}"></td>
    <td><input class="form-control form-control-sm" id="grossL${slabCount}"></td>
    <td><input class="form-control form-control-sm" id="grossH${slabCount}"></td>
    <td><input class="form-control form-control-sm" id="netL${slabCount}"></td>
    <td><input class="form-control form-control-sm" id="netH${slabCount}"></td>
    <td>
      <button class="btn btn-sm btn-danger" onclick="removeSlab(${slabCount})">
        Remove
      </button>
    </td>
  `;

  document.getElementById("slabBody").appendChild(tr);
}

function removeSlab(no) {
  const row = document.getElementById("slabRow" + no);
  if (row) row.remove();
}

function submitForm() {
  const slabs = [];

  for (let i = 1; i <= slabCount; i++) {
    const row = document.getElementById("slabRow" + i);
    if (!row) continue;

    slabs.push({
      slabNo: document.getElementById("slabNo" + i).value,
      thickness: document.getElementById("thickness" + i).value,
      grossL: document.getElementById("grossL" + i).value,
      grossH: document.getElementById("grossH" + i).value,
      netL: document.getElementById("netL" + i).value,
      netH: document.getElementById("netH" + i).value
    });
  }

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      factory: factory.value,
      colour: colour.value,
      buyer: buyer.value,
      marker: marker.value,
      blockNo: blockNo.value,
      date: date.value,
      allowance: allowance.value,
      unit: unit.value,
      slabs: slabs
    })
  })
  .then(res => res.text())
  .then(() => alert("Saved successfully"))
  .catch(err => alert("Error: " + err.message));
}

// add first slab automatically
addSlab();
</script>

</body>

</html>
